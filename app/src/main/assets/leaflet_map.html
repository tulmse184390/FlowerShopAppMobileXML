<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; }
        #map { width: 100%; height: 100%; }
        .leaflet-control-attribution { display: none; }
        .custom-popup .leaflet-popup-content-wrapper {
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        var map = L.map('map', {zoomControl: false}).setView([10.762622, 106.660172], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19
        }).addTo(map);
        
        L.control.zoom({ position: 'topright' }).addTo(map);
        
        var markers = {};
        var routePolyline = null;
        var paddingBottom = 0;
        
        function setMapPadding(bottomPadPx) {
            paddingBottom = bottomPadPx;
        }
        
        function addMarkers(storesData) {
            var stores = typeof storesData === 'string' ? JSON.parse(storesData) : storesData;
            
            for (var id in markers) {
                map.removeLayer(markers[id]);
            }
            markers = {};
            
            if (stores.length === 0) return;
            
            var bounds = [];
            stores.forEach(function(store) {
                var marker = L.marker([store.latitude, store.longitude]).addTo(map);
                marker.bindPopup("<b>" + store.storeName + "</b><br>" + store.address, { className: 'custom-popup' });
                
                marker.on('click', function() {
                    if(window.Android) {
                        window.Android.onMarkerClick(store.locationId);
                    }
                });
                
                markers[store.locationId] = marker;
                bounds.push([store.latitude, store.longitude]);
            });
            
            if (bounds.length > 0) {
                var lBounds = L.latLngBounds(bounds);
                map.fitBounds(lBounds, { paddingBottomRight: [0, paddingBottom], maxZoom: 15 });
            }
        }
        
        function focusOnStore(lat, lng, storeId) {
            map.flyTo([lat, lng], 15, {
                paddingBottomRight: [0, paddingBottom]
            });
            if (markers[storeId]) {
                setTimeout(function() {
                    markers[storeId].openPopup();
                }, 500);
            }
        }
        
        function drawRoute(routeData) {
            if (routePolyline) {
                map.removeLayer(routePolyline);
            }
            var pathCoords = typeof routeData === 'string' ? JSON.parse(routeData) : routeData;
            var latlngs = pathCoords.map(function(p) { return [p.lat, p.lng]; });
            
            routePolyline = L.polyline(latlngs, {color: '#F4487D', weight: 8, opacity: 0.8}).addTo(map);
            
            var lBounds = routePolyline.getBounds();
            map.fitBounds(lBounds, { padding: [50, 50], paddingBottomRight: [0, paddingBottom] });
        }
        
        function clearRoute() {
            if (routePolyline) {
                map.removeLayer(routePolyline);
                routePolyline = null;
            }
        }
        
        var userMarker = null;
        function showUserLocation(lat, lng) {
            if (userMarker) {
                map.removeLayer(userMarker);
            }
            userMarker = L.circleMarker([lat, lng], {
                radius: 8,
                fillColor: "#0078FF",
                color: "#FFFFFF",
                weight: 2,
                opacity: 1,
                fillOpacity: 1
            }).addTo(map);
        }
    </script>
</body>
</html>
